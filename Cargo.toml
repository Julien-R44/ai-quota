[package]
name = "ai-quota"
version = "0.1.0"
edition = "2024"
description = "Claude Code, Codex, and Amp usage limits in the Windows tray, for almost no memory."
license = "MIT"
repository = "https://github.com/Julien-R44/ai-quota"

[dependencies]
regex-lite = "0.1.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
windows-numerics = "0.3"
windows-registry = "0.6"

[dependencies.windows]
version = "0.62"
features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
# Every unsafe block must say why it is sound.
undocumented_unsafe_blocks = "deny"
pedantic = { level = "warn", priority = -1 }
# Noise for Win32 and graphics code: pixel math casts, hex colors, short math names.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
unreadable_literal = "allow"
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
